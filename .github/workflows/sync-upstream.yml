name: Sync fork with upstream

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync master with upstream
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/horsicq/xxfclib.git
          git fetch upstream master

          changed_files="$(git diff --name-only HEAD upstream/master -- . || true)"
          changed_files="$(printf '%s\n' "$changed_files" | grep -v '^\.github/workflows/sync-upstream\.yml$' || true)"

          if [ -z "$changed_files" ]; then
            echo "Fork is already up to date with upstream code"
            exit 0
          fi

          workflow_file="$(mktemp)"
          cp .github/workflows/sync-upstream.yml "$workflow_file"
          git checkout upstream/master -- .
          mkdir -p .github/workflows
          cp "$workflow_file" .github/workflows/sync-upstream.yml
          rm "$workflow_file"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit after preserving the sync workflow"
            exit 0
          fi

          git commit -m "chore: sync fork with upstream"
          git push origin HEAD:master --force
